apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: doughnut-gateway
  namespace: red-hat-provisions
spec:
  # For OpenShift with Istio, use your Istio GatewayClass name
  # Common values: istio, openshift-gateway
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
